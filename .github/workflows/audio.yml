name: Audio della rassegna

on:
  push:
    branches: [main]
    paths:
      - "data/**.json"
      - "scripts/genera_audio.py"
      - ".github/workflows/audio.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "Data dell'edizione (AAAA-MM-GG). Vuoto = la più recente."
        required: false

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa il motore vocale
        run: pip install edge-tts

      - name: Genera l'audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          AUDIO_SPUNTI: ${{ vars.AUDIO_SPUNTI }}
        run: python scripts/genera_audio.py ${{ github.event.inputs.date }}

      - name: Pubblica l'audio
        run: |
          git config user.name "il-punto-bot"
          git config user.email "il-punto-bot@users.noreply.github.com"
          git add audio data
          if git diff --cached --quiet; then echo "Niente da pubblicare"; exit 0; fi
          git commit -m "Audio dell'edizione"
          git pull --rebase origin main
          git push origin HEAD:main
